<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จุดเข้า-ออกการเดินเรือคลองปานามา (Panama Canal Entry & Exit Points)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        h2 {
            color: #1a365d;
        }
        #map {
            height: 650px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h2>📍 แผนที่จุดเข้า-ออก และเส้นทางเดินเรือคลองปานามา</h2>
    <div id="map"></div>

    <!-- นำ API Key ของ Google Maps มาวางแทนที่ YOUR_API_KEY -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU
    &callback=initMap" async defer></script>

    <script>
        function initMap() {
            // จุดศูนย์กลางครอบคลุมแนวคลองปานามา
            const panamaCenter = { lat: 9.1011, lng: -79.6953 };

            // สร้างแผนที่แบบ Hybrid (ดาวเทียมผสมชื่อสถานที่)
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 10,
                center: panamaCenter,
                mapTypeId: "hybrid",
            });

            // ตำแหน่งจุดเข้า-ออกเรือ และประตูระบายน้ำหลัก
            const entryExitLocations = [
                {
                    title: "⚓ 1. จุดเข้าเรือฝั่งแปซิฟิก (Pacific Entrance / Anchorage)",
                    lat: 8.8833,
                    lng: -79.5167,
                    type: "entry",
                    description: "<b>จุดจอดเรือรอลำดับเข้า (Pacific Anchorage)</b><br>เรือสินค้าจะทิ้งสมอรอลำดับการเข้ารับบริการเดินเรือผ่านคลองปานามาจากฝั่งมหาสมุทรแปซิฟิก"
                },
                {
                    title: "🏗️ 2. ปากทางเข้าและท่าเรือฝั่งแปซิฟิก (Port of Balboa)",
                    lat: 8.9551,
                    lng: -79.5639,
                    type: "port",
                    description: "<b>ท่าเรือบัลโบอา</b><br>จุดเทียบท่าและขนถ่ายสินค้าหน้าด่านฝั่งมหาสมุทรแปซิฟิก"
                },
                {
                    title: "🔒 3. ประตูระบายน้ำมิราโฟลเรส (Miraflores Locks)",
                    lat: 8.9967,
                    lng: -79.5919,
                    type: "lock",
                    description: "<b>Miraflores Locks</b><br>ประตูระบายน้ำด่านแรกสำหรับเรือที่เดินทางมาจากฝั่งแปซิฟิก"
                },
                {
                    title: "🌊 4. เส้นทางร่องน้ำกลางคลอง (Gatun Lake Waterway)",
                    lat: 9.1833,
                    lng: -79.8333,
                    type: "route",
                    description: "<b>ทะเลสาบกาตุน</b><br>เส้นทางน้ำจืดสายหลักกลางคลองปานามาที่เรือใช้สัญจรข้ามทวีป"
                },
                {
                    title: "🔒 5. ประตูระบายน้ำอากวา คลารา (Agua Clara Locks)",
                    lat: 9.2703,
                    lng: -79.9229,
                    type: "lock",
                    description: "<b>Agua Clara Locks</b><br>ประตูระบายน้ำขนาดใหญ่สำหรับเรือ Neopanamax ฝั่งแอตแลนติก"
                },
                {
                    title: "🏗️ 6. ปากทางเข้าและท่าเรือฝั่งแอตแลนติก (Port of Cristobal)",
                    lat: 9.3475,
                    lng: -79.9056,
                    type: "port",
                    description: "<b>ท่าเรือคริสโตบัล</b><br>ท่าเรือหลักบริเวณปากทางออกสู่ทะเลแคริบเบียน/มหาสมุทรแอตแลนติก"
                },
                {
                    title: "⚓ 7. จุดออกเรือฝั่งแอตแลนติก (Atlantic Entrance / Limon Bay)",
                    lat: 9.3833,
                    lng: -79.9167,
                    type: "exit",
                    description: "<b>จุดจอดและออกเรืออ่าวลิมอน (Atlantic Anchorage)</b><br>จุดปล่อยเรือออกสู่มหาสมุทรแอตแลนติก หรือจุดจอดรอคิวสำหรับเรือที่จะมุ่งหน้าลงใต้ไปแปซิฟิก"
                }
            ];

            // วาดเส้นทางเดินเรือเชื่อมต่อจุดเข้า-ออก (Polyline)
            const routeCoordinates = entryExitLocations.map(loc => ({ lat: loc.lat, lng: loc.lng }));
            const shippingPath = new google.maps.Polyline({
                path: routeCoordinates,
                geodesic: true,
                strokeColor: "#00E676", // เส้นทางสีเขียวสะท้อนแสง
                strokeOpacity: 0.9,
                strokeWeight: 5,
            });
            shippingPath.setMap(map);

            // ปักหมุดบนแผนที่
            entryExitLocations.forEach((location) => {
                // เลือกสีหมุดแยกตามประเภทจุดเข้า-ออก
                let iconUrl = "http://maps.google.com/mapfiles/ms/icons/red-dot.png"; // ทั่วไป
                if (location.type === "entry" || location.type === "exit") {
                    iconUrl = "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"; // จุดจอดเรือ/จุดเข้าออก
                } else if (location.type === "lock") {
                    iconUrl = "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png"; // ประตูระบายน้ำ
                } else if (location.type === "port") {
                    iconUrl = "http://maps.google.com/mapfiles/ms/icons/green-dot.png"; // ท่าเรือ
                }

                const marker = new google.maps.Marker({
                    position: { lat: location.lat, lng: location.lng },
                    map: map,
                    title: location.title,
                    icon: iconUrl
                });

                const infoWindow = new google.maps.InfoWindow({
                    content: `<div style="padding: 5px; color: #333;">
                                <h4 style="margin: 0 0 5px 0;">${location.title}</h4>
                                <p style="margin: 0; font-size: 13px;">${location.description}</p>
                              </div>`,
                });

                marker.addListener("click", () => {
                    infoWindow.open(map, marker);
                });
            });
        }
    </script>
</body>
</html>
